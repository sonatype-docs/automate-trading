name: Delete merged PR branches

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-merged-pr-branches.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR source branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          delete_branch() {
            local branch="$1"
            local repo="$2"
            if [ -z "$branch" ] || [ "$branch" = "main" ] || [ "$repo" != "${GITHUB_REPOSITORY}" ]; then
              return 0
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              echo "Deleting merged source branch: $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            delete_branch "${{ github.event.pull_request.head.ref }}" "${{ github.event.pull_request.head.repo.full_name }}"
            exit 0
          fi

          gh pr list             --repo "${GITHUB_REPOSITORY}"             --state merged             --base main             --limit 100             --json headRefName,headRepositoryOwner,headRepositoryName,baseRefName             --jq '.[] | select(.baseRefName == "main") | [.headRefName, (.headRepositoryOwner + "/" + .headRepositoryName)] | @tsv' |
          while IFS=$'\t' read -r branch repo; do
            delete_branch "$branch" "$repo"
          done
