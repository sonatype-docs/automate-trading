name: Deploy to AWS (Sydney)

on:
  workflow_dispatch:
    inputs:
      desired_tasks:
        description: "Running app copies (0 = infra only)"
        default: "0"

env:
  AWS_REGION: ap-southeast-2
  STACK: shark-auto-trader
  REPO: shark-auto-trader-app
  PREFIX_LIST: pl-b8a742d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure image repository
        run: aws ecr describe-repositories --repository-names $REPO || aws ecr create-repository --repository-name $REPO --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$REPO:${GITHUB_SHA::12}
          if ! aws ecr describe-images --repository-name $REPO --image-ids imageTag=${GITHUB_SHA::12} >/dev/null 2>&1; then
            docker build -f Dockerfile.aws -t $IMAGE .
            docker push $IMAGE
          fi
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy stack
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Removing failed empty stack before retry"
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi
          aws cloudformation deploy \
            --stack-name $STACK \
            --template-file deploy/aws/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ApplicationImageUri=$IMAGE \
              CloudFrontPrefixListId=$PREFIX_LIST \
              DesiredTaskCount=${{ inputs.desired_tasks }}
      - name: Show outputs
        run: aws cloudformation describe-stacks --stack-name $STACK --query "Stacks[0].Outputs" --output table
