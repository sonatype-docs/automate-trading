name: Deploy to AWS (Sydney)

on:
  workflow_dispatch:
    inputs:
      desired_tasks:
        description: "Running app copies (0 = infra only)"
        default: "0"

env:
  AWS_REGION: ap-southeast-2
  STACK: shark-auto-trader
  REPO: shark-auto-trader-app
  PREFIX_LIST: pl-b8a742d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure image repository
        run: aws ecr describe-repositories --repository-names $REPO || aws ecr create-repository --repository-name $REPO --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$REPO:${GITHUB_SHA::12}
          if ! aws ecr describe-images --repository-name $REPO --image-ids imageTag=${GITHUB_SHA::12} >/dev/null 2>&1; then
            docker build -f Dockerfile.aws -t $IMAGE .
            docker push $IMAGE
          fi
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy stack
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Removing resources retained by the failed first deployment"
            for BUCKET in \
              "shark-auto-trader-assets-$(aws sts get-caller-identity --query Account --output text)-$AWS_REGION" \
              "shark-auto-trader-files-$(aws sts get-caller-identity --query Account --output text)-$AWS_REGION" \
              "shark-auto-trader-backups-$(aws sts get-caller-identity --query Account --output text)-$AWS_REGION"; do
              OBJECTS=$(aws s3api list-object-versions --bucket "$BUCKET" --query 'length(Versions || `[]`) + length(DeleteMarkers || `[]`)' --output text 2>/dev/null || echo missing)
              if [ "$OBJECTS" = "0" ]; then
                aws s3api delete-bucket --bucket "$BUCKET"
              elif [ "$OBJECTS" != "missing" ]; then
                echo "Refusing to delete non-empty retained bucket: $BUCKET" >&2
                exit 1
              fi
            done
            for SECRET in shark-auto-trader/application shark-auto-trader/scheduler shark-auto-trader/database; do
              aws secretsmanager delete-secret --secret-id "$SECRET" --force-delete-without-recovery >/dev/null 2>&1 || true
            done
            USER_POOL_ID=$(aws cognito-idp list-user-pools --max-results 60 --query "UserPools[?Name=='shark-auto-trader-users'].Id | [0]" --output text)
            if [ -n "$USER_POOL_ID" ] && [ "$USER_POOL_ID" != "None" ]; then
              aws cognito-idp delete-user-pool --user-pool-id "$USER_POOL_ID"
            fi
            aws logs delete-log-group --log-group-name /aws/ecs/shark-auto-trader 2>/dev/null || true
            echo "Removing failed stack before retry"
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi
          aws cloudformation deploy \
            --stack-name $STACK \
            --template-file deploy/aws/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ApplicationImageUri=$IMAGE \
              CloudFrontPrefixListId=$PREFIX_LIST \
              DesiredTaskCount=${{ inputs.desired_tasks }}
      - name: Show outputs
        run: aws cloudformation describe-stacks --stack-name $STACK --query "Stacks[0].Outputs" --output table
