name: Deploy to AWS (Sydney) # reconciled-main release trigger
# Quant specialist research pipeline release trigger

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
      - "tsconfig.json"
      - "Dockerfile.aws"
      - "Dockerfile.migration"
      - "deploy/aws/**"
      - "deploy/aws/template.yaml"
      - "quant-engine/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      desired_tasks:
        description: Running application copies
        required: false
        default: "1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: shark-auto-trader-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  STACK: shark-auto-trader-runtime
  REPO: shark-auto-trader-app
  QUANT_REPO: shark-auto-trader-quant-engine
  FILES_BUCKET: shark-auto-trader-files-438456517782-ap-southeast-2
  BACKUPS_BUCKET: shark-auto-trader-backups-438456517782-ap-southeast-2
  USER_POOL_ID: ap-southeast-2_3CQ298jr5
  APP_SECRET: shark-auto-trader/application
  SCHEDULER_SECRET: shark-auto-trader/scheduler
  DATABASE_SECRET: shark-auto-trader/database
  TASK_EXECUTION_ROLE_NAME: shark-auto-trader-runtime-execution
  TASK_ROLE_NAME: shark-auto-trader-runtime-task

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify account and protected production resources
        shell: bash
        run: |
          set -Eeuo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT_ID" = "438456517782"
          test "${AWS_DEFAULT_REGION:-$AWS_REGION}" = "$AWS_REGION"
          for bucket in "$FILES_BUCKET" "$BACKUPS_BUCKET"; do
            aws s3api head-bucket --bucket "$bucket"
            versioning="$(aws s3api get-bucket-versioning --bucket "$bucket" --query Status --output text)"
            test "$versioning" = "Enabled"
          done
          for secret in "$APP_SECRET" "$SCHEDULER_SECRET" "$DATABASE_SECRET"; do
            aws secretsmanager describe-secret --secret-id "$secret" >/dev/null
          done
          app_secret_arn="$(aws secretsmanager describe-secret --secret-id "$APP_SECRET" --query ARN --output text)"
          scheduler_secret_arn="$(aws secretsmanager describe-secret --secret-id "$SCHEDULER_SECRET" --query ARN --output text)"
          database_secret_arn="$(aws secretsmanager describe-secret --secret-id "$DATABASE_SECRET" --query ARN --output text)"
          aws cognito-idp describe-user-pool --user-pool-id "$USER_POOL_ID" >/dev/null
          read -r db_host vpc_id db_sg < <(aws rds describe-db-instances --db-instance-identifier shark-auto-trader --query "DBInstances[0].[Endpoint.Address,DBSubnetGroup.VpcId,VpcSecurityGroups[0].VpcSecurityGroupId]" --output text)
          test -n "$db_host" && test "$db_host" != None
          test -n "$vpc_id" && test "$vpc_id" != None
          test -n "$db_sg" && test "$db_sg" != None
          execution_role_arn="$(aws iam get-role --role-name "$TASK_EXECUTION_ROLE_NAME" --query 'Role.Arn' --output text)"
          task_role_arn="$(aws iam get-role --role-name "$TASK_ROLE_NAME" --query 'Role.Arn' --output text)"
          test -n "$execution_role_arn" && test "$execution_role_arn" != None
          test -n "$task_role_arn" && test "$task_role_arn" != None
          echo "External ECS execution and task roles verified."
          {
            echo "DATABASE_HOST=$db_host"
            echo "EXISTING_VPC_ID=$vpc_id"
            echo "DATABASE_SECURITY_GROUP_ID=$db_sg"
            echo "APPLICATION_SECRET_ARN=$app_secret_arn"
            echo "SCHEDULER_SECRET_ARN=$scheduler_secret_arn"
            echo "DATABASE_SECRET_ARN=$database_secret_arn"
            echo "TASK_EXECUTION_ROLE_ARN=$execution_role_arn"
            echo "TASK_ROLE_ARN=$task_role_arn"
          } >> "$GITHUB_ENV"

      - name: Ensure image repositories
        shell: bash
        run: |
          set -Eeuo pipefail
          for repo in "$REPO" "$QUANT_REPO"; do
            if ! aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repo" --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true >/dev/null
            fi
          done

      - name: Enforce bounded ECR retention
        shell: bash
        run: |
          set -Eeuo pipefail
          lifecycle_policy='{"rules":[{"rulePriority":1,"description":"Keep newest 30 tagged images","selection":{"tagStatus":"tagged","tagPatternList":["*"],"countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}},{"rulePriority":2,"description":"Remove untagged images after 1 day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}}]}'
          for repo in "$REPO" "$QUANT_REPO"; do
            aws ecr put-lifecycle-policy --repository-name "$repo" --lifecycle-policy-text "$lifecycle_policy" >/dev/null
          done
          echo "ECR lifecycle policies applied."

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve CloudFront origin prefix list and Cognito client
        shell: bash
        run: |
          set -Eeuo pipefail
          prefix_list="$(aws ec2 describe-managed-prefix-lists \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' --output text)"
          test -n "$prefix_list" && test "$prefix_list" != None
          client_id="$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "$USER_POOL_ID" --max-results 60 \
            --query 'UserPoolClients[?ClientName==`shark-auto-trader-web`].ClientId | [0]' \
            --output text)"
          if [ -z "$client_id" ] || [ "$client_id" = None ]; then
            client_id="$(aws cognito-idp create-user-pool-client \
              --user-pool-id "$USER_POOL_ID" \
              --client-name shark-auto-trader-web \
              --no-generate-secret \
              --prevent-user-existence-errors ENABLED \
              --explicit-auth-flows ALLOW_REFRESH_TOKEN_AUTH ALLOW_USER_SRP_AUTH \
              --query UserPoolClient.ClientId --output text)"
          fi
          {
            echo "PREFIX_LIST=$prefix_list"
            echo "COGNITO_CLIENT_ID=$client_id"
          } >> "$GITHUB_ENV"

      - name: Remove only empty failed CloudFormation metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$status" = ROLLBACK_COMPLETE ]; then
            live_count="$(aws cloudformation list-stack-resources --stack-name "$STACK" \
              --output json | jq '[.StackResourceSummaries[] | select(.ResourceStatus != "DELETE_COMPLETE" and .ResourceStatus != "DELETE_SKIPPED")] | length')"
            if [ "$live_count" -ne 0 ]; then
              echo "Failed stack still has non-deleted resources; refusing cleanup." >&2
              exit 1
            fi
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          elif [ "$status" = ROLLBACK_FAILED ] || [ "$status" = DELETE_FAILED ]; then
            echo "CloudFormation stack is $status; refusing to delete or replace resources." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - name: Test embedded quant engine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quant engine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r quant-engine/requirements.txt
          cd quant-engine
          PYTHONPATH=. pytest -q

      - name: Install and test application
        shell: bash
        env:
          VITE_DATA_BACKEND: aws
          VITE_COGNITO_USER_POOL_ID: ${{ env.USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile
          bun run test

      - name: Validate infrastructure template
        shell: bash
        run: |
          set -Eeuo pipefail
          aws cloudformation validate-template \
            --template-body file://deploy/aws/template.yaml >/dev/null

      - name: Build and push immutable application image
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -Eeuo pipefail
          image="$REGISTRY/$REPO:${GITHUB_SHA::12}"
          if ! aws ecr describe-images --repository-name "$REPO" \
              --image-ids imageTag="${GITHUB_SHA::12}" >/dev/null 2>&1; then
            docker build -f Dockerfile.aws \
              --build-arg VITE_DATA_BACKEND=aws \
              --build-arg VITE_COGNITO_USER_POOL_ID="$USER_POOL_ID" \
              --build-arg VITE_COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" \
              -t "$image" .
            docker push "$image"
          fi

          quant_image="$REGISTRY/$QUANT_REPO:${GITHUB_SHA::12}"
          if aws ecr describe-images --repository-name "$QUANT_REPO" --image-ids imageTag="${GITHUB_SHA::12}" >/dev/null 2>&1; then
            docker pull "$quant_image"
          else
            docker build -f quant-engine/Dockerfile -t "$quant_image" quant-engine
            docker push "$quant_image"
          fi

          # ECS production tasks pull from the existing app repository, which is already
          # authorized by the protected execution-role boundary. Keep the dedicated quant
          # repository as the artifact source, and publish the same immutable image under
          # a unique runtime tag in the approved app repository.
          runtime_quant_image="$REGISTRY/$REPO:quant-${GITHUB_SHA::12}"
          if ! aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="quant-${GITHUB_SHA::12}" >/dev/null 2>&1; then
            docker tag "$quant_image" "$runtime_quant_image"
            docker push "$runtime_quant_image"
          fi

          migration_image="$REGISTRY/$REPO:migration-${GITHUB_SHA::12}"
          if ! aws ecr describe-images --repository-name "$REPO" \
              --image-ids imageTag="migration-${GITHUB_SHA::12}" >/dev/null 2>&1; then
            echo "Building migration image for this commit so bootstrap changes are deployed."
            docker build -f Dockerfile.migration -t "$migration_image" .
            docker push "$migration_image"
          fi

          {
            echo "IMAGE=$image"
            echo "QUANT_IMAGE=$runtime_quant_image"
            echo "MIGRATION_IMAGE=$migration_image"
          } >> "$GITHUB_ENV"

      - name: Deploy infrastructure without destructive recovery
        shell: bash
        env:
          DESIRED_TASKS: ${{ inputs.desired_tasks || '1' }}
        run: |
          set -Eeuo pipefail
          on_cfn_error() {
            echo "CloudFormation deployment failed; recent stack events:" >&2
            aws cloudformation describe-stack-events \
              --stack-name "$STACK" \
              --max-items 30 \
              --query "StackEvents[].{Time:Timestamp,Logical:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}" \
              --output table || true
          }
          trap on_cfn_error ERR
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file deploy/aws/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ApplicationImageUri="$IMAGE" \
              QuantEngineImageUri="$QUANT_IMAGE" \
              MigrationImageUri="$MIGRATION_IMAGE" \
              CloudFrontPrefixListId="$PREFIX_LIST" \
              FilesBucketName="$FILES_BUCKET" \
              BackupsBucketName="$BACKUPS_BUCKET" \
              ApplicationSecretName="$APP_SECRET" \
              SchedulerSecretName="$SCHEDULER_SECRET" \
             DatabaseSecretName="$DATABASE_SECRET" \
              ApplicationSecretArn="$APPLICATION_SECRET_ARN" \
              SchedulerSecretArn="$SCHEDULER_SECRET_ARN" \
              DatabaseSecretArn="$DATABASE_SECRET_ARN" \
              ExistingVpcId="$EXISTING_VPC_ID" \
              DatabaseHost="$DATABASE_HOST" \
              DatabaseSecurityGroupId="$DATABASE_SECURITY_GROUP_ID" \
              TaskExecutionRoleArn="$TASK_EXECUTION_ROLE_ARN" \
              TaskRoleArn="$TASK_ROLE_ARN" \
              ComputeWorkerCount="1" \
             CognitoUserPoolId="$USER_POOL_ID" \
              CognitoUserPoolClientId="$COGNITO_CLIENT_ID" \
              DesiredTaskCount="$DESIRED_TASKS" \
              EnableContainerInsights="false" \
              SchedulePaper="false" \
              ScheduleStrategy="false" \
              ScheduleLive="false" \
              ScheduleWatchdog="false"

      - name: Wait for ECS, invalidate CloudFront, and verify live application
        shell: bash
        run: |
          set -Eeuo pipefail
          output_json="$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs' --output json)"
          cluster="$(jq -r '.[] | select(.OutputKey=="ClusterName").OutputValue' <<< "$output_json")"
          cloudfront_url="$(jq -r '.[] | select(.OutputKey=="CloudFrontUrl").OutputValue' <<< "$output_json")"
          distribution_id="$(aws cloudformation list-stack-resources --stack-name "$STACK" \
            --query "StackResourceSummaries[?LogicalResourceId=='Distribution'].PhysicalResourceId | [0]" --output text)"
          test -n "$distribution_id" && test "$distribution_id" != None

          aws ecs wait services-stable --cluster "$cluster" --services shark-auto-trader-app

          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$distribution_id" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution_id" \
            --id "$invalidation_id"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$cloudfront_url/api/public/ready" >/dev/null; then
              break
            fi
            echo "Readiness attempt $attempt failed; retrying..." >&2
            sleep 10
          done

          curl --fail --silent --show-error "$cloudfront_url/" -o /tmp/cloudfront-index.html
          test -s /tmp/cloudfront-index.html
          grep -qi '<html' /tmp/cloudfront-index.html

          asset_path="$(grep -oE '/assets/[^"]+\\.(css|js)(\\?[^" ]*)?' /tmp/cloudfront-index.html | head -1 || true)"
          if [ -n "$asset_path" ]; then
            curl --fail --silent --show-error "$cloudfront_url$asset_path" -o /dev/null
            echo "Verified CloudFront asset: $asset_path"
          else
            echo "No /assets CSS/JS path found in root HTML; root page is healthy."
          fi

          chmod +x deploy/aws/live-smoke.sh
          deploy/aws/live-smoke.sh "$cloudfront_url"

      - name: Print deployment outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs' --output table
