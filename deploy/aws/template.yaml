AWSTemplateFormatVersion: "2010-09-09"
Description: Safe Shark Auto Trader production foundation. Protected production resources are referenced, never recreated or deleted. Research jobs are queued in PostgreSQL and processed by isolated ECS workers.

Parameters:
  SchedulePaper: { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  ScheduleStrategy: { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  ScheduleLive: { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  ScheduleWatchdog: { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  ApplicationImageUri:
    Type: String
  MigrationImageUri:
    Type: String
  CloudFrontPrefixListId:
    Type: String
  FilesBucketName:
    Type: String
    Default: shark-auto-trader-files-438456517782-ap-southeast-2
  BackupsBucketName:
    Type: String
    Default: shark-auto-trader-backups-438456517782-ap-southeast-2
  ApplicationSecretName:
    Type: String
    Default: shark-auto-trader/application
  SchedulerSecretName:
    Type: String
    Default: shark-auto-trader/scheduler
  DatabaseSecretName:
    Type: String
    Default: shark-auto-trader/database
  ApplicationSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:ap-southeast-2:438456517782:secret:shark-auto-trader/application-xlmKH9
  SchedulerSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:ap-southeast-2:438456517782:secret:shark-auto-trader/scheduler-T5qtFw
  DatabaseSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:ap-southeast-2:438456517782:secret:shark-auto-trader/database-vYzHkt
  CognitoUserPoolId:
    Type: String
    Default: ap-southeast-2_3CQ298jr5
  CognitoUserPoolClientId:
    Type: String
    Default: 5s7f0br06vd6qdo3u4pmr97m7m
  ApplicationLogGroupName:
    Type: String
    Default: /aws/ecs/shark-auto-trader
  ExistingVpcId:
    Type: String
    Default: vpc-09bab6b4cc11a4e50
  DatabaseHost:
    Type: String
    Default: shark-auto-trader.cng2wy6mkioz.ap-southeast-2.rds.amazonaws.com
  DatabaseSecurityGroupId:
    Type: String
    Default: sg-09380c4de14177398
  TaskExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::438456517782:role/shark-auto-trader-runtime-execution
  TaskRoleArn:
    Type: String
    Default: arn:aws:iam::438456517782:role/shark-auto-trader-runtime-task
  ComputeWorkerCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
  DesiredTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  EnableContainerInsights:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  DatabaseInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro]

Conditions:
  EnableContainerInsightsCondition: !Equals [!Ref EnableContainerInsights, "true"]

Resources:
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ExistingVpcId
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.20.0/24
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.21.0/24
      MapPublicIpOnLaunch: true
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront access to the application load balancer
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer and ECS task access to the application
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup

  ComputeWorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Isolated outbound-only security group for quantitative compute workers
      VpcId: !Ref ExistingVpcId
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  ComputeDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ComputeWorkerSecurityGroup

  QuantArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }

  ComputeWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shark-auto-trader-compute-worker
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: compute-worker-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${QuantArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt QuantArtifactsBucket.Arn

  ApplicationFilesAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: shark-auto-trader-private-files
      Roles:
        - !Select [1, !Split ["/", !Ref TaskRoleArn]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${FilesBucketName}/private/accounts/*"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${QuantArtifactsBucket.Arn}/*"
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::${FilesBucketName}"
            Condition:
              StringLike:
                s3:prefix: ["private/accounts/*"]

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: shark-auto-trader-assets
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref ExistingVpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/public/health
      Matcher: { HttpCode: "200" }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: !If
        - EnableContainerInsightsCondition
        - [{ Name: containerInsights, Value: enabled }]
        - !Ref AWS::NoValue
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      EphemeralStorage: { SizeInGiB: 50 }
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref MigrationImageUri
          Essential: true
          Environment:
            - { Name: PGHOST, Value: !Ref DatabaseHost }
            - { Name: PGPORT, Value: "5432" }
            - { Name: PGDATABASE, Value: sharktrader }
            - { Name: FILES_BUCKET, Value: !Ref FilesBucketName }
            - { Name: MIGRATION_ID, Value: lovable-export-2026-09-24 }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub "${DatabaseSecretArn}:username::" }
            - { Name: PGPASSWORD, ValueFrom: !Sub "${DatabaseSecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: application
          Image: !Ref ApplicationImageUri
          Essential: true
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: DATA_BACKEND, Value: aws }
            - { Name: HOST, Value: 0.0.0.0 }
            - { Name: PORT, Value: "3000" }
            - { Name: AWS_FILES_BUCKET, Value: !Ref FilesBucketName }
            - { Name: AWS_BACKUPS_BUCKET, Value: !Ref BackupsBucketName }
            - { Name: QUANT_ARTIFACTS_BUCKET, Value: !Ref QuantArtifactsBucket }
            - { Name: DATABASE_HOST, Value: !Ref DatabaseHost }
            - { Name: DATABASE_PORT, Value: "5432" }
            - { Name: DATABASE_NAME, Value: sharktrader }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref CognitoUserPoolClientId }
            - { Name: SCHEDULE_PAPER, Value: !Ref SchedulePaper }
            - { Name: SCHEDULE_STRATEGY, Value: !Ref ScheduleStrategy }
            - { Name: SCHEDULE_LIVE, Value: !Ref ScheduleLive }
            - { Name: SCHEDULE_WATCHDOG, Value: !Ref ScheduleWatchdog }
          Secrets:
            - { Name: SHARKEXCHANGE_API_KEY, ValueFrom: !Sub "${ApplicationSecretArn}:SHARKEXCHANGE_API_KEY::" }
            - { Name: SHARKEXCHANGE_API_SECRET, ValueFrom: !Sub "${ApplicationSecretArn}:SHARKEXCHANGE_API_SECRET::" }
            - { Name: TRADINGVIEW_WEBHOOK_SECRET, ValueFrom: !Sub "${ApplicationSecretArn}:TRADINGVIEW_WEBHOOK_SECRET::" }
            - { Name: SCHEDULER_SECRET, ValueFrom: !Sub "${SchedulerSecretArn}:SCHEDULER_SECRET::" }
            - { Name: DATABASE_USER, ValueFrom: !Sub "${DatabaseSecretArn}:username::" }
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub "${DatabaseSecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command: [CMD-SHELL, "wget -q -O /dev/null http://localhost:3000/api/public/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
  ComputeWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30

  ComputeWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      EphemeralStorage: { SizeInGiB: 50 }
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !GetAtt ComputeWorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: compute-worker
          Image: !Ref ApplicationImageUri
          Essential: true
          Command: ["node", "/app/compute-worker.mjs"]
          StopTimeout: 120
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: DATA_BACKEND, Value: aws }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: QUANT_ARTIFACTS_BUCKET, Value: !Ref QuantArtifactsBucket }
            - { Name: DATABASE_HOST, Value: !Ref DatabaseHost }
            - { Name: DATABASE_PORT, Value: "5432" }
            - { Name: DATABASE_NAME, Value: sharktrader }
          Secrets:
            - { Name: DATABASE_USER, ValueFrom: !Sub "${DatabaseSecretArn}:username::" }
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub "${DatabaseSecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ComputeWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: compute

  ComputeWorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: shark-auto-trader-compute-worker
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ComputeWorkerTaskDefinition
      DesiredCount: !Ref ComputeWorkerCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ComputeWorkerSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: shark-auto-trader-app
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredTaskCount
      LaunchType: FARGATE
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      HealthCheckGracePeriodSeconds: 90
      LoadBalancers:
        - { ContainerName: application, ContainerPort: 3000, TargetGroupArn: !Ref TargetGroup }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ApplicationSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Listener
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: app-origin
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
          - Id: assets-origin
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: app-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: true
            Cookies: { Forward: all }
            Headers: [Authorization, Host]
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 0
          Compress: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        Restrictions:
          GeoRestriction: { RestrictionType: none }
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  AlarmTopic:
    Type: AWS::SNS::Topic
  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  CloudFrontUrl: { Value: !Sub "https://${Distribution.DomainName}" }
  AssetsBucketName: { Value: !Ref AssetsBucket }
  FilesBucketName: { Value: !Ref FilesBucketName }
  BackupsBucketName: { Value: !Ref BackupsBucketName }
  DatabaseEndpoint: { Value: !Ref DatabaseHost }
  UserPoolId: { Value: !Ref CognitoUserPoolId }
  UserPoolClientId: { Value: !Ref CognitoUserPoolClientId }
  ClusterName: { Value: !Ref EcsCluster }
  ServiceName: { Value: shark-auto-trader-app }
  MigrationTaskDefinitionArn: { Value: !Ref MigrationTaskDefinition }
  PublicSubnetA: { Value: !Ref PublicSubnetA }
  PublicSubnetB: { Value: !Ref PublicSubnetB }
  ApplicationSecurityGroup: { Value: !Ref ApplicationSecurityGroup }
  QuantArtifactsBucketName: { Value: !Ref QuantArtifactsBucket }
  ComputeWorkerServiceName: { Value: shark-auto-trader-compute-worker }
